services:
    mysql:
        container_name: mblog-mysql
        image: mysql/mysql-server:5.7
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        environment:
            MYSQL_DATABASE: db_mblog
            MYSQL_ROOT_PASSWORD: 12345
            MYSQL_ROOT_HOST: '%'
            TZ: Asia/Shanghai
        expose:
            - "3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p12345"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: always

    server:
        container_name: mblog-server
        image: langhsu/mblog:latest
        build: .
        working_dir: /app/mblog
        environment:
            TZ: Asia/Shanghai
        ports:
            - "8080:8080"
        volumes:
            - storage_data:/app/mblog/storage
            - logs_data:/app/mblog/logs
        depends_on:
            mysql:
                condition: service_healthy
        restart: always

volumes:
    mysql_data:
    storage_data:
    logs_data: